<!DOCTYPE html>
<html>
<head>
  <title>HOD Dashboard</title>
  <style>
    body { font-family: Arial; background: #f4f6f9; padding: 20px; }
    h2 { color: #1b2a49; margin-bottom: 20px; }
    .filter-box { margin-bottom: 15px; }
    select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; min-width: 200px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
    th { background: #e8edf3; }
    .empty { color: #777; font-style: italic; }
    button { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; margin: 2px; }
    .approve { background: #28a745; color: #fff; }
    .reject { background: #dc3545; color: #fff; }
    #bulkApprove { margin-top: 25px; padding: 10px 15px; background: #0d6efd; color: #fff; border-radius: 5px; border: none; cursor: pointer; }
  </style>
</head>
<body>

<h2>HOD Dashboard</h2>

<div class="filter-box">
  <label><strong>Filter by Advisor:</strong></label>
  <select id="advisorFilter">
    <option value="">-- Select Advisor --</option>
  </select>
</div>

<table id="hodTable">
  <thead>
    <tr>
      <th>Select</th>
      <th>Student</th>
      <th>Date From</th>
      <th>Date To</th>
      <th>Reason</th>
      <th>Advisor Approval</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="tableBody">
    <tr>
      <td colspan="7" class="empty">Loading requests...</td>
    </tr>
  </tbody>
</table>

<button id="bulkApprove">Bulk Approve Selected</button>

<script src="config.js"></script>
<script>
const tableBody = document.getElementById("tableBody");
const advisorFilter = document.getElementById("advisorFilter");

async function loadAdvisors() {
  try {
    const res = await fetch(`${API_URL}/hod/advisors`);
    const advisors = await res.json();
    advisors.forEach(a => {
      const opt = document.createElement("option");
      opt.value = a.id;
      opt.textContent = a.name;
      advisorFilter.appendChild(opt);
    });
  } catch (err) {
    console.error("Failed to load advisors:", err);
  }
}

async function loadRequests(advisorId = "") {
  tableBody.innerHTML = `<tr><td colspan="7" class="empty">Loading requests...</td></tr>`;
  try {
    const res = await fetch(`${API_URL}/hod/requests?advisorId=${advisorId}`);
    const data = await res.json();
    tableBody.innerHTML = "";
    if (!data.length) {
      tableBody.innerHTML = `<tr><td colspan="7" class="empty">No requests to display</td></tr>`;
      return;
    }
    data.forEach(req => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><input type="checkbox" class="selectRow" data-id="${req.id}"></td>
        <td>${req.student_name}</td>
        <td>${req.date_from}</td>
        <td>${req.date_to}</td>
        <td>${req.reason}</td>
        <td>${req.advisor_approval ? "Approved" : "Pending"}</td>
        <td>
          <button class="approve" onclick="approveRequest(${req.id}, true)">Approve</button>
          <button class="reject" onclick="approveRequest(${req.id}, false)">Reject</button>
        </td>
      `;
      tableBody.appendChild(tr);
    });
  } catch (err) {
    console.error("Failed to load requests:", err);
    tableBody.innerHTML = `<tr><td colspan="7" class="empty">Error loading requests</td></tr>`;
  }
}

async function approveRequest(id, approve) {
  try {
    const res = await fetch(`${API_URL}/hod/requests/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ approve })
    });
    const data = await res.json();
    alert(data.message);
    loadRequests(advisorFilter.value);
  } catch (err) {
    alert("Error approving/rejecting request");
  }
}

document.getElementById("bulkApprove").addEventListener("click", async () => {
  const selected = Array.from(document.querySelectorAll(".selectRow:checked")).map(cb => cb.dataset.id);
  if (!selected.length) return alert("No requests selected for bulk approve");
  try {
    const res = await fetch(`${API_URL}/hod/requests/bulk`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: selected })
    });
    const data = await res.json();
    alert(data.message);
    loadRequests(advisorFilter.value);
  } catch (err) {
    alert("Error bulk approving requests");
  }
});

advisorFilter.addEventListener("change", () => loadRequests(advisorFilter.value));

loadAdvisors();
loadRequests();
</script>

</body>
</html>
